[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medanalyser-backend"
version = "0.1.0"
description = "MedAnalyser — AI-assisted health assessment platform (FastAPI backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pgvector>=0.3,<1.0",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1,<26.0",
    "pyjwt[crypto]>=2.9,<3.0",
    "email-validator>=2.2,<3.0",
    # ML inference. Training-only extras live in the [ml] group so the API
    # runtime stays lean.
    "scikit-learn>=1.5,<2.0",
    "numpy>=1.26,<3.0",
    "joblib>=1.4,<2.0",
    # Medical report processing: native PDF text, with OCR as a fallback for
    # scanned documents.
    "pymupdf>=1.24,<2.0",
    "pytesseract>=0.3.10,<1.0",
    "pillow>=10.3,<12.0",
]

[project.optional-dependencies]
ml = [
    "pandas>=2.2,<3.0",
    "xgboost>=2.1,<4.0",
    # python.org builds ship no CA bundle, so dataset download needs one.
    "certifi>=2024.2",
]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on the filesystem directly (that an upload landed, that a delete
# removed it). These are trivial local reads with no event loop to block, and
# routing them through anyio would obscure what is being asserted.
"tests/**" = ["ASYNC240"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error::DeprecationWarning:app.*",
    # PyMuPDF's SWIG bindings emit these on import; not actionable here.
    "ignore:builtin type Swig.* has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["app"]
